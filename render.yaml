services:
  # ----------------------------------------------------------------------------
  # 1. BACKEND API & REALTIME WEBSOCKET GATEWAY
  # ----------------------------------------------------------------------------
  - type: web
    name: sony-social-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build:packages && npm run prisma:generate --workspace=@sony/api && npm run build --workspace=@sony/api
    startCommand: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma && node apps/api/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: api/v1
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: sony-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  # ----------------------------------------------------------------------------
  # 2. FRONTEND EXPO WEB APPLICATION (STATIC SITE)
  # ----------------------------------------------------------------------------
  - type: web
    name: sony-social-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build:packages && npm run mobile:build
    staticPublishPath: apps/mobile/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20

databases:
  # ----------------------------------------------------------------------------
  # 3. MANAGED POSTGRESQL DATABASE
  # ----------------------------------------------------------------------------
  - name: sony-postgres
    plan: free
    region: oregon
    databaseName: social_music_db
    user: sony_user
